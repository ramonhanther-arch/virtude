project_id = "virtude"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[studio]
enabled = true
port = 54323
[local_smtp]
enabled = true
port = 54324
[auth]
enabled = true
site_url = "http://localhost:3210"
additional_redirect_urls = ["http://localhost:3210/auth/callback", "http://127.0.0.1:3210/auth/callback", "http://localhost:3210/auth/callback?next=/redefinir", "http://127.0.0.1:3210/auth/callback?next=/redefinir"]
jwt_expiry = 900
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
[auth.rate_limit]
email_sent = 3
sign_in_sign_ups = 20
token_refresh = 100
